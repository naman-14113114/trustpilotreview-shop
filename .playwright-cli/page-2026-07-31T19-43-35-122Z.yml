      - generic [ref=f2e23]:
        - paragraph [ref=f2e24]: Grounding sheets come in two main formats. A fitted sheet wraps around the mattress like everyday bedding, while a flat sheet lies across the sleep surface and may need more adjustment. Before comparing prices, check the exact mattress dimensions, pocket depth and whether the quoted price is for Single, Twin, Queen or another size.
        - paragraph [ref=f2e25]: The conductive fibres connect to a properly grounded wall outlet through a lead supplied by the manufacturer. Setup should be simple, but shoppers should still check the outlet, read the instructions and confirm that the cord and plug are intended for the United States. A grounding sheet is a wellness product and should not replace advice or treatment from a qualified healthcare professional.
        - paragraph [ref=f2e26]: Care instructions and trial terms matter just as much as the fabric. Some detergents and fabric treatments can coat conductive fibres, so follow the maker's wash guidance. Juujo takes our top spot because it combines a fitted design, seven US sizes, a 90% cotton and 10% conductive silver blend, a $99 Single entry price, a 120-night trial and three useful extras in one clearly presented bundle.
